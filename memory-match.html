<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memory Match 💜</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #16002b, #42106b, #18002e);
            color: white;
            text-align: center;
            padding: 25px 15px;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #ddd;
            margin-bottom: 20px;
        }

        .score-board {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 25px;
            font-size: 18px;
        }

        .game-board {
            width: 100%;
            max-width: 500px;
            margin: auto;

            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .card {
            height: 110px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.5s;
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner,
        .card.matched .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 18px;

            backface-visibility: hidden;

            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .card-front {
            background: linear-gradient(135deg, #8e44ad, #e056fd);
            font-size: 35px;
        }

        .card-back {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            transform: rotateY(180deg);
            font-size: 42px;
        }

        .card.matched .card-back {
            background: #218c4b;
        }

        button {
            margin-top: 25px;
            padding: 14px 25px;
            border: none;
            border-radius: 15px;
            background: #e056fd;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #c445e8;
        }

        .message {
            min-height: 30px;
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        @media (max-width: 500px) {

            .card {
                height: 80px;
            }

            .card-front {
                font-size: 28px;
            }

            .card-back {
                font-size: 32px;
            }

            .game-board {
                gap: 8px;
            }
        }

    </style>
</head>

<body>

    <h1>🃏 Memory Match 💜</h1>

    <p class="subtitle">
        Find all the matching pairs! ✨
    </p>

    <div class="score-board">

        <div>
            Moves: <span id="moves">0</span>
        </div>

        <div>
            Pairs: <span id="pairs">0</span>/8
        </div>

    </div>


    <div class="game-board" id="gameBoard"></div>


    <div class="message" id="message"></div>


    <button onclick="restartGame()">
        🔄 Restart Game
    </button>

    <br>

    <button onclick="goBack()">
        🏠 Back to Birthday Adventure
    </button>


    <script>

        const symbols = [
            "❤️",
            "💜",
            "💖",
            "✨",
            "🌸",
            "🥰",
            "🎂",
            "🎁"
        ];


        let cards = [...symbols, ...symbols];

        let firstCard = null;
        let secondCard = null;

        let lockBoard = false;

        let moves = 0;
        let pairs = 0;


        function shuffle(array) {

            array.sort(() => Math.random() - 0.5);

        }


        function createBoard() {

            const board = document.getElementById("gameBoard");

            board.innerHTML = "";

            shuffle(cards);

            cards.forEach((symbol, index) => {

                const card = document.createElement("div");

                card.classList.add("card");

                card.dataset.symbol = symbol;

                card.innerHTML = `

                    <div class="card-inner">

                        <div class="card-front">
                            💜
                        </div>

                        <div class="card-back">
                            ${symbol}
                        </div>

                    </div>

                `;

                card.addEventListener("click", flipCard);

                board.appendChild(card);

            });

        }


        function flipCard() {

            if (lockBoard) return;

            if (this === firstCard) return;

            if (this.classList.contains("matched")) return;

            this.classList.add("flipped");


            if (!firstCard) {

                firstCard = this;

                return;

            }


            secondCard = this;

            moves++;

            document.getElementById("moves").innerText = moves;

            checkMatch();

        }


        function checkMatch() {

            const isMatch =
                firstCard.dataset.symbol ===
                secondCard.dataset.symbol;


            if (isMatch) {

                disableCards();

            } else {

                unflipCards();

            }

        }


    function disableCards() {

    firstCard.classList.add("matched");

    secondCard.classList.add("matched");

    pairs++;

    document.getElementById("pairs").innerText = pairs;

    resetCards();


    if (pairs === 8) {

        document.getElementById("message").innerText =
            "🎉 Memory Master! Next Level ❤️";

        setTimeout(() => {

            window.location.href = "catch-hearts.html";

        }, 1500);

    }

}


        function unflipCards() {

            lockBoard = true;

            setTimeout(() => {

                firstCard.classList.remove("flipped");

                secondCard.classList.remove("flipped");

                resetCards();

            }, 900);

        }


        function resetCards() {

            firstCard = null;

            secondCard = null;

            lockBoard = false;

        }


        function restartGame() {

            moves = 0;

            pairs = 0;

            firstCard = null;

            secondCard = null;

            lockBoard = false;

            document.getElementById("moves").innerText = "0";

            document.getElementById("pairs").innerText = "0";

            document.getElementById("message").innerText = "";

            createBoard();

        }


        function goBack() {

            window.location.href = "page2.html";

        }


        createBoard();

    </script>

</body>
</html>
