<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catch the Hearts ❤️</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #16002b, #42106b, #18002e);
            color: white;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            margin-top: 25px;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #ddd;
        }

        .score-board {
            display: flex;
            justify-content: center;
            gap: 35px;
            margin: 20px 0;
            font-size: 18px;
        }

        #gameArea {
            position: relative;
            width: 90%;
            max-width: 600px;
            height: 500px;
            margin: auto;

            border-radius: 25px;
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.15);

            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .heart {
            position: absolute;
            font-size: 35px;
            cursor: pointer;
            user-select: none;

            animation: fall linear forwards;
        }

        @keyframes fall {

            from {
                transform: translateY(-50px);
            }

            to {
                transform: translateY(550px);
            }

        }

        .bonus {
            font-size: 42px;
        }

        #message {
            height: 35px;
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        button {
            margin: 12px 5px;
            padding: 13px 22px;
            border: none;
            border-radius: 15px;

            background: #e056fd;
            color: white;

            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #c445e8;
        }

        @media (max-width: 500px) {

            #gameArea {
                height: 450px;
            }

            .heart {
                font-size: 30px;
            }

        }

    </style>
</head>

<body>

    <h1>❤️ Catch the Hearts ❤️</h1>

    <p class="subtitle">
        Catch as many hearts as you can! ✨
    </p>


    <div class="score-board">

        <div>
            Score: <span id="score">0</span>
        </div>

        <div>
            Time: <span id="time">30</span>s
        </div>

    </div>


    <div id="gameArea"></div>


    <div id="message">
        Get Ready! 💜
    </div>


    <button onclick="startGame()">
        ❤️ Start Game
    </button>

    <button onclick="goBack()">
        🏠 Back
    </button>


    <script>

        let score = 0;
        let time = 30;

        let gameRunning = false;

        let heartInterval;
        let timerInterval;


        const gameArea = document.getElementById("gameArea");


        function startGame() {

            if (gameRunning) return;

            score = 0;
            time = 30;

            gameRunning = true;

            document.getElementById("score").innerText = score;
            document.getElementById("time").innerText = time;

            document.getElementById("message").innerText =
                "Catch them! ❤️";

            gameArea.innerHTML = "";


            heartInterval = setInterval(createHeart, 600);

            timerInterval = setInterval(() => {

                time--;

                document.getElementById("time").innerText = time;

                if (time <= 0) {

                    endGame();

                }

            }, 1000);

        }


        function createHeart() {

            if (!gameRunning) return;


            const heart = document.createElement("div");

            const hearts = [
                "❤️",
                "💖",
                "💜",
                "💕",
                "💗"
            ];


            heart.innerText =
                hearts[Math.floor(Math.random() * hearts.length)];


            heart.classList.add("heart");


            const maxLeft =
                gameArea.clientWidth - 45;

            const randomLeft =
                Math.random() * maxLeft;


            heart.style.left =
                randomLeft + "px";

            heart.style.top = "-50px";


            const duration =
                2 + Math.random() * 2;

            heart.style.animationDuration =
                duration + "s";
            heart.onclick = function () {

    score++;

    document.getElementById("score").innerText = score;

    this.remove();


    // 10 hearts catch ayithe next level
    if (score === 10) {

        gameRunning = false;

        clearInterval(heartInterval);
        clearInterval(timerInterval);

        gameArea.innerHTML = "";

        document.getElementById("message").innerText =
            "🎉 Level Complete! ❤️✨";

        setTimeout(() => {

            window.location.href = "future-memory.html";

        }, 1500);

    }

};


            gameArea.appendChild(heart);


            setTimeout(() => {

                if (heart.parentElement) {
                    heart.remove();
                }

            }, duration * 1000);

        }


        function endGame() {

            gameRunning = false;

            clearInterval(heartInterval);
            clearInterval(timerInterval);


            gameArea.innerHTML = "";


            let finalMessage;


            if (score >= 25) {

                finalMessage =
                    "🔥 Amazing! You're a Heart Master! ❤️";

            }
            else if (score >= 15) {

                finalMessage =
                    "😍 Great job! So many hearts caught! 💖";

            }
            else if (score >= 8) {

                finalMessage =
                    "✨ Nice! You did a great job! 💜";

            }
            else {

                finalMessage =
                    "🥰 Cute! Try again and catch more hearts! ❤️";

            }


            document.getElementById("message").innerText =
                "🎉 Game Over! Score: " +
                score +
                " | " +
                finalMessage;

        }


        function goBack() {

            window.location.href =
                "page2.html";

        }

    </script>

</body>
</html>
